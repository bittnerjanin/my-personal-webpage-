<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
</head>
<body>
<h1>Contact Me</h1>
<nav>
    <a href="index.html">Home</a> |
    <a href="about.html">About Me</a> |
    <a href="hobbies.html">Hobbies</a> |
    <a href="favorites.html">Favorites</a> |
    <a href="goals.html">Goals</a> |

</nav>
<hr>
<h2>Get in Touch</h2>
<p>
    Please fill out the form below if you have any questions,
    feedback, or inquiries.
</p>
<form>
    <label for="fullname">Full Name:</label><br>
    <input type="text" id="fullname" name="fullname" required>
    <br><br>
    <label for="email">Email Address:</label><br>
    <input type="email" id="email" name="email" required>
    <br><br>
    <label>Gender:</label><br>
    <input type="radio" id="male" name="gender" value="Male">
    <label for="male">Male</label>
    <input type="radio" id="female" name="gender" value="Female">
    <label for="female">Female</label>
    <br><br>
    <label>Interests:</label><br>
    <input type="checkbox" id="technology" name="interests" value="Technology">
    <label for="technology">Technology</label>
    <input type="checkbox" id="gaming" name="interests" value="Gaming">
    <label for="gaming">Gaming</label>
    <input type="checkbox" id="music" name="interests" value="Music">
    <label for="music">Music</label>
    <br><br>
    <label for="purpose">Purpose of Visit:</label><br>
    <select id="purpose" name="purpose">
        <option value="General Inquiry">General Inquiry</option>
        <option value="Feedback">Feedback</option>
        <option value="Collaboration">Collaboration</option>
        <option value="School Project">School Project</option>
    </select>
    <br><br>
    <label for="message">Message:</label><br>
    <textarea id="message" name="message" rows="5" cols="40"></textarea>
    <br><br>
    <input type="submit" value="Send Message">
    <input type="reset" value="Clear Form">
</form>
<hr>
<p>
    Thank you for visiting my personal website!
</p>
</body>
</html>
