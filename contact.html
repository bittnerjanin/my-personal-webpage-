<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header id="main-header">
    <h1>Contact Me</h1>
</header>

<nav>
    <a class="nav-link" href="index.html">Home</a> |
    <a class="nav-link" href="about.html">About Me</a> |
    <a class="nav-link" href="hobbies.html">Hobbies</a> |
    <a class="nav-link" href="favorites.html">Favorites</a> |
    <a class="nav-link" href="goals.html">Goals</a> |
    <a class="nav-link" href="contact.html">Contact Me</a>
</nav>

<hr>

<section id="contact-section">

<form action="https://formsubmit.co/bittnerjanin6@gmail.com" method="POST">

    <input type="hidden" name="_next" value="https://bittnerjanin.github.io/my-personal-webpage-/">

    <label>Full Name:</label>
    <input type="text" name="Full Name" required>

    <br><br>

    <label>Email Address:</label>
    <input type="email" name="Email Address" required>

    <br><br>

    <label>Gender:</label>

    <input type="radio" name="Gender" value="Male">
    Male

    <input type="radio" name="Gender" value="Female">
    Female

    <br><br>

    <label>Interests:</label>
    <br>

    <input type="checkbox" name="Interests1" value="Technology">
    Technology

    <input type="checkbox" name="Interests2" value="Gaming">
    Gaming

    <input type="checkbox" name="Interests3" value="Music">
    Music

    <input type="checkbox" name="Interests4" value="Anime">
    Anime

    <br><br>

    <label>Favorite Coding Language:</label>

    <select name="Favorite Coding Language">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>Python</option>
        <option>Java</option>
        <option>C++</option>
        <option>C#</option>
        <option>PHP</option>
        <option>Other</option>
    </select>

    <br><br>

    <label>Choose a Color:</label>
    <input type="color" name="Favorite Color" value="#000000">

    <br><br>

    <label>Rate My Website:</label>

    <select name="Website Rating">
        <option>⭐⭐⭐⭐⭐ Excellent</option>
        <option>⭐⭐⭐⭐ Good</option>
        <option>⭐⭐⭐ Average</option>
        <option>⭐⭐ Needs Improvement</option>
        <option>⭐ Poor</option>
    </select>

    <br><br>

    <label>Purpose of Visit:</label>

    <select name="Purpose of Visit">
        <option>General Inquiry</option>
        <option>Feedback</option>
        <option>Collaboration</option>
        <option>School Project</option>
    </select>

    <br><br>

    <label>Message:</label>
    <br>

    <textarea name="Message" rows="5" cols="40" required></textarea>

    <br><br>

    <input class="btn primary" type="submit" value="Send Message">
    <input class="btn" type="reset" value="Clear Form">

</form>

</section>

</body>
</html>
