<form action="https://formsubmit.co/bittnerjanin6@gmail.com" method="POST">

    <label>Full Name:</label>
    <input type="text" name="Full Name" required>
    <br><br>

    <label>Email Address:</label>
    <input type="email" name="Email Address" required>
    <br><br>

    <label>Gender:</label>
    <input type="radio" name="Gender" value="Male">
    Male

    <input type="radio" name="Gender" value="Female">
    Female
    <br><br>

    <label>Interests:</label>
    <br>

    <input type="checkbox" name="Interests" value="Technology">
    Technology

    <input type="checkbox" name="Interests" value="Gaming">
    Gaming

    <input type="checkbox" name="Interests" value="Music">
    Music

    <br><br>

    <label>Purpose of Visit:</label>

    <select name="Purpose of Visit">
        <option>General Inquiry</option>
        <option>Feedback</option>
        <option>Collaboration</option>
        <option>School Project</option>
    </select>

    <br><br>

    <label>Message:</label>
    <br>

    <textarea name="Message" rows="5" cols="40" required></textarea>

    <br><br>

    <input type="submit" value="Send Message">
    <input type="reset" value="Clear Form">

</form>
