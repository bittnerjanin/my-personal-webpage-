<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>
</head>

<body>

    <h1>Contact Me</h1>

    <nav>
        <a href="index.html">Home</a> |

    <hr>

    <h2>Send Me a Message</h2>

    <p>
        Please fill out the form below to send me
        information, feedback, or inquiries.
    </p>

    <!-- FORM -->
    <!-- Replace YOUR-FORM-ID with your Formspree endpoint -->
    <form action="https://formspree.io/f/xqpzqqvv" method="POST">

        <!-- 1. Full Name -->
        <label>Full Name:</label>
        <input type="text" name="Full Name" required>

        <br><br>

        <!-- 2. Email Address -->
        <label>Email Address:</label>
        <input type="email" name="Email Address" required>

        <br><br>

        <!-- 3. Gender -->
        <label>Gender:</label>

        <input type="radio" name="Gender" value="Male">
        Male

        <input type="radio" name="Gender" value="Female">
        Female

        <br><br>

        <!-- 4. Interests -->
        <label>Interests:</label>
        <br>

        <input type="checkbox" name="Interests" value="Technology">
        Technology

        <input type="checkbox" name="Interests" value="Gaming">
        Gaming

        <input type="checkbox" name="Interests" value="Music">
        Music

        <br><br>

        <!-- 5. Purpose of Visit -->
        <label>Purpose of Visit:</label>

        <select name="Purpose of Visit">
            <option value="General Inquiry">General Inquiry</option>
            <option value="Feedback">Feedback</option>
            <option value="Collaboration">Collaboration</option>
            <option value="School Project">School Project</option>
        </select>

        <br><br>

        <!-- 6. Message -->
        <label>Message:</label>
        <br>

        <textarea
            name="Message"
            rows="5"
            cols="40"
            required></textarea>

        <br><br>

        <!-- 7. Submit and Reset Buttons -->
        <input type="submit" value="Send Message">

        <input type="reset" value="Clear Form">

    </form>

    <hr>

    <p>
        Thank you for visiting my personal profile website!
    </p>

</body>
</html>
