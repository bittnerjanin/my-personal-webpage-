
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Contact Janin Bittner through her personal website. Send inquiries, feedback, or collaboration messages.">

    <title>Contact Me - Janin Bittner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<nav>
    <a class="nav-link" href="index.html">Home</a> |
    <a class="nav-link" href="about.html">About Me</a> |
    <a class="nav-link" href="hobbies.html">Hobbies</a> |
    <a class="nav-link" href="favorites.html">Favorites</a> |
    <a class="nav-link" href="goals.html">Goals</a> |
    <a class="nav-link" href="contact.html">Contact Me</a>
</nav>

<main>

<h1 id="main-header">Contact Me</h1>

<hr>

<form id="contact-section" action="https://formsubmit.co/bittnerjanin6@gmail.com" method="POST">

    <input type="hidden" name="_next" value="https://bittnerjanin.github.io/my-personal-webpage-/">

    <label for="full-name">Full Name:</label>
    <input type="text" id="full-name" name="Full Name" required>

    <br><br>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="Email Address" required>

    <br><br>

    <label>Gender:</label>

    <input type="radio" id="male" name="Gender" value="Male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="Gender" value="Female">
    <label for="female">Female</label>

    <br><br>

    <label>Interests:</label>
    <br>

    <input type="checkbox" id="technology" name="Interests1" value="Technology">
    <label for="technology">Technology</label>

    <input type="checkbox" id="gaming" name="Interests2" value="Gaming">
    <label for="gaming">Gaming</label>

    <input type="checkbox" id="music" name="Interests3" value="Music">
    <label for="music">Music</label>

    <input type="checkbox" id="anime" name="Interests4" value="Anime">
    <label for="anime">Anime</label>

    <br><br>

    <label for="coding-language">Favorite Coding Language:</label>

    <select id="coding-language" name="Favorite Coding Language">
        <option>HTML</option>
        <option>CSS</option>
        <option>JavaScript</option>
        <option>Python</option>
        <option>Java</option>
        <option>C++</option>
        <option>C#</option>
        <option>PHP</option>
        <option>Other</option>
    </select>

    <br><br>

    <label for="favorite-color">Choose a Color:</label>
    <input type="color" id="favorite-color" name="Favorite Color" value="#000000">

    <br><br>

    <label for="website-rating">Rate My Website:</label>

    <select id="website-rating" name="Website Rating">
        <option>⭐⭐⭐⭐⭐ Excellent</option>
        <option>⭐⭐⭐⭐ Good</option>
        <option>⭐⭐⭐ Average</option>
        <option>⭐⭐ Needs Improvement</option>
        <option>⭐ Poor</option>
    </select>

    <br><br>

    <label for="visit-purpose">Purpose of Visit:</label>

    <select id="visit-purpose" name="Purpose of Visit">
        <option>General Inquiry</option>
        <option>Feedback</option>
        <option>Collaboration</option>
        <option>School Project</option>
    </select>

    <br><br>

    <label for="message">Message:</label>
    <br>

    <textarea id="message" name="Message" rows="5" cols="40" required></textarea>

    <br><br>

    <input class="btn primary" type="submit" value="Send Message">
    <input class="btn" type="reset" value="Clear Form">

</form>

</main>

</body>
</html>
